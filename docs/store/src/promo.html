<!doctype html>
<!-- Store promo graphics. ?size=small (440×280), large (1400×560) or logo (300×300).
     Rendered by scripts/store-graphics.sh. -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { background: linear-gradient(135deg, #0f6cbd 0%, #0b5299 100%) fixed; }
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color: #fff; }
  .tile { position: relative; display: flex; align-items: center; overflow: hidden; }
  .icon { flex: none; filter: drop-shadow(0 6px 18px rgba(0,0,0,.25)); }
  .icon rect { stroke: rgba(255,255,255,.35); stroke-width: 3; }
  h1 { margin: 0; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
  p { margin: 0; opacity: .88; font-weight: 500; line-height: 1.3; }
  .small { width: 440px; height: 280px; padding: 0 34px; gap: 24px; }
  .small .icon { width: 104px; height: 104px; }
  .small h1 { font-size: 36px; }
  .small p { font-size: 17px; margin-top: 10px; }
  .large { width: 1400px; height: 560px; padding-left: 96px; gap: 44px; }
  .large .icon { width: 168px; height: 168px; }
  .large h1 { font-size: 64px; }
  .large p { font-size: 28px; margin-top: 16px; max-width: 470px; }
  .large .shot { position: absolute; left: 820px; top: 92px; width: 1040px; border-radius: 12px;
                 box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .logo { width: 300px; height: 300px; justify-content: center; background: #fff; }
  .logo .icon { width: 236px; height: 236px; filter: none; }
  .logo .icon rect { stroke: none; }
</style></head><body>
<script>
  const size = new URLSearchParams(location.search).get('size') || 'small';
  fetch('../../../icons/src/icon.svg').then((r) => r.text()).then((svg) => {
    const icon = `<div class="icon">${svg.replace('<svg ', '<svg width="100%" height="100%" ')}</div>`;
    const text = `<div><h1>Superfavorites<br>Bar</h1><p>${size === 'large'
      ? 'Workspaces, pins and quick search for your bookmarks, in a bar on every page.'
      : 'Workspaces for your bookmarks'}</p></div>`;
    document.body.innerHTML = size === 'logo' ? `<div class="tile logo">${icon}</div>`
      : `<div class="tile ${size}">${icon}${text}${size === 'large' ? '<img class="shot" src="../../screenshots/workspaces.png">' : ''}</div>`;
    document.title = 'ready';
  });
</script>
</body></html>
