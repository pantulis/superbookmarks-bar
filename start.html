<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f7; --card: #ffffff; --fg: #1b1b1b; --muted: #616161; --border: #e0e0e0; --accent: #0f6cbd;
      --hover: rgba(127, 127, 127, .12); --folder: #d99a1e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #202020; --card: #2b2b2b; --fg: #f2f2f2; --muted: #ababab; --border: #3d3d3d; --accent: #4aa0f0; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
    main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 48px; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 24px; }
    #search {
      flex: 1 1 260px; max-width: 420px; margin-left: auto; padding: 8px 12px; font: inherit; color: var(--fg);
      background: var(--card); border: 1px solid var(--border); border-radius: 8px; outline: none;
    }
    #search:focus { border-color: var(--accent); }
    #pins { display: flex; flex-wrap: wrap; gap: 6px; }
    .pin {
      position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
      color: inherit; text-decoration: none; background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    }
    .pin:hover { border-color: var(--accent); }
    .badge {
      position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      color: #fff; background: #d13438; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center;
    }
    .badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: -3px; right: -3px; }
    /* The current workspace spans the page, its contents flowing in columns. */
    #current .card { margin-bottom: 0; padding: 10px 10px 12px; }
    #current .card h2 { font-size: 18px; padding: 6px 8px 12px; }
    #current .card h2 .emoji { font-size: 20px; }
    #current .card > ul { columns: 230px; column-gap: 24px; }
    #current .card > ul > li { break-inside: avoid; }
    #others-title { margin: 28px 0 12px; color: var(--muted); font-size: 13px; font-weight: 600; }
    /* The other workspaces side by side, scrolling sideways if they don't fit. */
    #cards { display: flex; align-items: flex-start; gap: 16px; overflow-x: auto; padding-bottom: 8px; }
    #cards .card { flex: 0 0 260px; }
    .card {
      break-inside: avoid; margin-bottom: 16px; padding: 6px 6px 8px; background: var(--card);
      border: 1px solid var(--border); border-top: 3px solid var(--ws-color, var(--border)); border-radius: 8px;
    }
    .card h2 { display: flex; align-items: center; gap: 8px; margin: 0; padding: 6px 8px 8px; font-size: 15px; font-weight: 600; }
    .card h2 small { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; }
    .emoji { font-size: 16px; line-height: 1; }
    .ico, .fav img, .pin img, .ws-image { width: 16px; height: 16px; flex-shrink: 0; }
    .ico.folder { color: var(--folder); }
    ul { list-style: none; margin: 0; padding: 0; }
    ul ul { padding-left: 16px; }
    .fav, summary {
      display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 3px 8px; border-radius: 4px;
      color: inherit; text-decoration: none; cursor: pointer;
    }
    .fav:hover, summary:hover, .fav:focus-visible { background: var(--hover); outline: none; }
    .fav span, summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fav.inert { cursor: default; color: var(--muted); }
    summary { list-style: none; }
    summary .chevron { width: 12px; height: 12px; margin: 0 -4px 0 -2px; color: var(--muted); transition: transform .15s; }
    details[open] > summary .chevron { transform: rotate(90deg); }
    summary::-webkit-details-marker { display: none; }
    summary .count { margin-left: auto; color: var(--muted); font-size: 12px; }
    hr { margin: 4px 8px; border: 0; border-top: 1px solid var(--border); }
    .hidden { display: none !important; }
    #empty { color: var(--muted); text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <nav id="pins" aria-label="Pinned favorites"></nav>
      <input id="search" type="search" placeholder="Search favorites or the web" aria-label="Search favorites or the web" autocomplete="off">
    </header>
    <div id="current"></div>
    <h3 id="others-title" class="hidden">Other workspaces</h3>
    <div id="cards"></div>
    <p id="empty" class="hidden">No favorites match. Press Enter to search the web.</p>
  </main>
  <script src="icon-themes.js"></script>
  <script src="start.js"></script>
</body>
</html>
