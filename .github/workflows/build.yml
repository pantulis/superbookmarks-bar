# Builds the extension zip for the Chrome Web Store and Edge Add-ons. The zip
# is attached to the run, and for a v* tag also published as a GitHub release.
# Uploading it to the stores is done by hand.
name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create releases
    steps:
      - uses: actions/checkout@v7

      - name: Pack
        id: pack
        env:
          # On a tag push, the tag must match the manifest version.
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: echo "zip=$(./scripts/pack.sh)" >> "$GITHUB_OUTPUT"

      # Upload the zip as-is, so the download isn't a zip inside a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.zip }}
          archive: false

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.zip }}"
          --title "Superfavorites Bar ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
