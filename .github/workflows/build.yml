# Builds the extension zip for the Chrome Web Store and Edge Add-ons. The zip
# is attached to the run; uploading it to the stores is done by hand.
name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack
        id: pack
        env:
          # On a tag push, the tag must match the manifest version.
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: echo "zip=$(./scripts/pack.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: superfavorites-bar
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
